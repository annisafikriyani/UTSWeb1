<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Pengiriman - BLOOM BOOK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">
  <header class="app-header">
    <a class="brand" href="dashboard.html">
      <span class="brand__mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>
      </span>
      BLOOM BOOK
    </a>
    <nav class="nav" aria-label="Navigasi utama">
      <a href="dashboard.html" data-page="dashboard">Dashboard</a>
      <a href="stok.html" data-page="stok">Katalog</a>
      <a href="checkout.html" data-page="checkout">Pemesanan</a>
      <a href="tracking.html" data-page="tracking">Tracking</a>
    </nav>
    <div class="user-box">
      <div><strong id="userName">-</strong><span class="muted" id="userRole">-</span></div>
      <button class="btn btn--ghost btn--small" type="button" id="btnLogout">Keluar</button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Informasi Pengiriman</h1>
      <p>Masukkan nomor Delivery Order untuk melihat status dan perjalanan paket.</p>
    </div>

    <section class="card" aria-labelledby="judulCari">
      <h2 id="judulCari">Cari nomor DO</h2>
      <form class="search-form" id="formCari" novalidate>
        <div style="flex:1 1 240px">
          <label class="sr-only" for="inputDO">Nomor Delivery Order</label>
          <input class="input" type="text" id="inputDO" name="nomorDO" inputmode="numeric" placeholder="Contoh: 20230012" autocomplete="off">
          <p class="field__error" role="alert" id="errDO"></p>
        </div>
        <button class="btn btn--primary" type="submit">Cari</button>
      </form>
      <div class="chips">
        Coba nomor contoh:
        <button class="chip" type="button" data-do="20230012">20230012</button>
        <button class="chip" type="button" data-do="20230013">20230013</button>
      </div>
    </section>

    <section class="card result" id="hasil" aria-live="polite" hidden></section>
  </main>

  <footer class="site-footer">BLOOM BOOK &middot; Tugas UTS Pemrograman Web</footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
